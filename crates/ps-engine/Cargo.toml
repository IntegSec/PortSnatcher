[package]
name = "ps-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PortSnatcher probe engines: Connect (Phase 2), Raw (Phase 4)."

[dependencies]
ps-core = { path = "../ps-core" }
ps-bus = { path = "../ps-bus" }

tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
time = { workspace = true }

# Phase 4 RawEngine dependencies.
socket2 = { version = "0.5", features = ["all"] }
which = "6"

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux SYN-race engine: raw AF_PACKET for crafted SYN send,
# pnet::datalink for pcap-style SYN-ACK receive. Requires CAP_NET_RAW
# at runtime. macOS/Windows intentionally do not get this dep yet —
# their RawEngine stays on the connect fallback until v1.3+.
pnet = "0.35"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
proptest = { workspace = true }
tempfile = { workspace = true }
