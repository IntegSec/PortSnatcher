name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-upload:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin portsnatcher

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/portsnatcher dist/
          cp LICENSE NOTICE README.md dist/
          cd dist
          tar czf ../portsnatcher-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/portsnatcher.exe dist/
          Copy-Item LICENSE, NOTICE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath portsnatcher-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Upload to release (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} portsnatcher-${{ github.ref_name }}-${{ matrix.target }}.tar.gz --clobber

      - name: Upload to release (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload ${{ github.ref_name }} portsnatcher-${{ github.ref_name }}-${{ matrix.target }}.zip --clobber

  publish-crates:
    name: publish to crates.io
    needs: build-and-upload
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Publish (ordered)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN not set; skipping crates.io publish."
            exit 0
          fi
          set -e
          for crate in ps-core ps-bus ps-notify ps-engine ps-fingerprint ps-proxy; do
            echo "::group::publish $crate"
            cargo publish -p "$crate" --allow-dirty || echo "::warning::publish $crate failed (may already exist)"
            echo "::endgroup::"
            sleep 10
          done
          cargo publish -p integsec-portsnatcher --allow-dirty || echo "::warning::publish integsec-portsnatcher failed"
