[workspace]
resolver = "2"
members = ["crates/ps-core", "crates/ps-bus"]

# Disk-constrained dev profile. Debug info is the bulk of target/; disabling
# it drops artifact size by 60-70% at the cost of losing source-level
# debugging. Tests still give stack traces (via panics) and error messages
# remain fully informative. Revisit when we have more disk headroom.
[profile.dev]
debug = 0
incremental = false


[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/IntegSec/PortSnatcher"
authors = ["IntegSec <security@integsec.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"

# HTTP / web
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
reqwest-eventsource = "0.6"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling / logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# IDs / time / paths
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
directories = "5"

# Networking types
ipnet = { version = "2", features = ["serde"] }
hickory-resolver = "0.24"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Desktop toast
notify-rust = "4"

# Utility
bytes = "1"

# Testing
insta = { version = "1", features = ["json", "yaml"] }
proptest = "1"
httpmock = "0.7"
tempfile = "3"
