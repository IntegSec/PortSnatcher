[package]
name = "portsnatcher-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
httparse = "1"

ps-core = { path = "../crates/ps-core" }
ps-fingerprint = { path = "../crates/ps-fingerprint" }

[[bin]]
name = "fuzz_scope_file"
path = "fuzz_targets/fuzz_scope_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_event_deserialize"
path = "fuzz_targets/fuzz_event_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_http_parse"
path = "fuzz_targets/fuzz_http_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_tls_parse"
path = "fuzz_targets/fuzz_tls_parse.rs"
test = false
doc = false
bench = false

# cargo-fuzz generates these implicitly, but we spell them out so the
# crate is not part of the main workspace (it has its own deps and
# cannot use the workspace-level dev profile).
[workspace]
